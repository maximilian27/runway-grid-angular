<main style="height: 400px; width: 400px; margin: 0; overflow: hidden; background: #f8f9fa;">
  <app-runway-wrapper
      class="primary-grid"
      [bufferSize]="10"
      [items]="massiveDataset"
      [rowSize]="48">

    <!-- Complex Expandable Row Template -->
    <ng-template let-i="index" let-item>
      <div [class.is-expanded]="item.expanded"
           [class.odd]="i % 2 !== 0"
           [class.even]="i % 2 === 0"
           [attr.part]="'row-card ' + (i % 2 === 0 ? 'even row-even row-card-even' : 'odd row-odd row-card-odd') + (item.expanded ? ' is-expanded' : '')"
           class="row-card">

        <!-- Header / Main Bar -->
        <div class="row-header" part="row-header">
          <div class="row-info" part="row-info">
            <span class="row-badge" part="row-badge">#{{ i }}</span>
            <span class="row-title" part="row-title">{{ item.title }}</span>
          </div>

          @if (item.isExpandable) {
            <button
                (click)="toggleExpand(item, $event)"
                [class.active]="item.expanded"
                [attr.part]="item.expanded ? 'expand-btn active' : 'expand-btn'"
                class="expand-btn">
              {{ item.expanded ? 'Collapse ▲' : 'Expand ▼' }}
            </button>
          }
        </div>

        <!-- Collapsible Details Panel (Auto-Triggers ResizeObserver) -->
        @if (item.isExpandable && item.expanded) {
          <div class="row-details" part="row-details">
            <div class="details-content" part="details-content">
              <strong>Category:</strong> {{ item.category }}<br/>
              <p part="row-details-text">{{ item.details }}</p>
            </div>
          </div>
        }

      </div>
    </ng-template>

  </app-runway-wrapper>
</main>
