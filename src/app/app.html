<main style="height: 100vh; width: 100vw; margin: 0; overflow: hidden;">
  <app-runway-wrapper [items]="massiveDataset" [rowSize]="40">
    <!-- Project your template here -->
    <ng-template let-i="index" let-item>
      <div style="padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;">
        <span style="color: blue;">Row #{{ i }}</span>
      </div>
    </ng-template>
  </app-runway-wrapper>
</main>
